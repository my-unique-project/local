<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f6fb">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <title>GeoStamp — Photo Location Timestamp</title>

  <style>
    :root {
      color-scheme: light;
      --bg: #f3f6fb;
      --panel: #ffffff;
      --panel-2: #e8eef6;
      --text: #1c293b;
      --muted: #65758b;
      --accent: #3478d4;
      --danger: #e32636;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100dvh;
      padding: max(18px, env(safe-area-inset-top)) 16px
        max(18px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text);
      font-family: "Urbanist", sans-serif;
      font-size: 18px;
    }

    button, input {
      font: inherit;
    }

    .app {
      width: min(100%, 520px);
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      display: inline-grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border-radius: 17px;
      background: linear-gradient(145deg, #6ba8f4, #3478d4);
      color: #fff;
      font-size: 25px;
      box-shadow: 0 10px 30px #3478d433;
    }

    h1 {
      font-size: clamp(29px, 7vw, 38px);
      margin: 13px 0 6px;
      letter-spacing: -.5px;
    }

    header p {
      color: var(--muted);
      margin: 0;
      font-size: 17px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid #dce5f0;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 18px 48px #29476b14;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .action {
      min-height: 132px;
      border: 1px solid #d7e2ef;
      border-radius: 18px;
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 11px;
      font-weight: 700;
      transition: transform .15s, border-color .15s;
      -webkit-tap-highlight-color: transparent;
    }

    .action:active {
      transform: scale(.98);
    }

    .action:hover {
      border-color: var(--accent);
    }

    .action .symbol {
      font-size: 32px;
      line-height: 1;
      color: var(--accent);
    }

    .hint {
      color: rgb(232, 3, 3);
      font-size: 15px;
      text-align: center;
      margin: 17px 0 0;
      line-height: 1.5;
    }

    .status {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #fff1f1;
      border: 1px solid #f1c7cb;
      color: #d91c2b;
      font-weight: 600;
      font-size: 15px;
      line-height: 1.45;
    }

    .status.show {
      display: block;
    }

    .status.info {
      background: #edf5ff;
      border-color: #c9def8;
      color: #245b9b;
      font-weight: 400;
    }

    #fileInput {
      display: none;
    }

    .workspace {
      display: none;
      margin-top: 18px;
    }

    .workspace.show {
      display: block;
    }

    .preview-wrap {
      overflow: hidden;
      border-radius: 16px;
      background: #e9eef5;
      border: 1px solid #d5dfeb;
      min-height: 150px;
    }

    #preview {
      display: block;
      width: 100%;
      height: auto;
      max-height: 62dvh;
      object-fit: contain;
    }

    video {
      display: none;
      width: 100%;
      max-height: 62dvh;
      background: #e9eef5;
      object-fit: contain;
    }

    .tools {
      display: flex;
      gap: 10px;
      margin-top: 13px;
    }

    .tool-btn {
      flex: 1;
      border: 0;
      border-radius: 12px;
      padding: 16px 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: var(--accent);
      transition: transform .15s;
    }

    .tool-btn:active {
      transform: scale(.98);
    }

    .tool-btn.secondary {
      background: #e7edf5;
      color: #31445d;
      border: 1px solid #d4deea;
    }

    .tool-btn:disabled {
      opacity: .55;
      cursor: wait;
    }

    .small-note {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin: 12px 2px 0;
    }

    .watermark {
      font-family: "Allura", cursive;
      text-align: center;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: .2px;
      margin-top: 25px;
      background: linear-gradient(90deg, #3478d4, #8e44ad, #e32636);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
    }

    @media (max-width: 360px) {
      .panel {
        padding: 16px;
      }

      .action {
        min-height: 116px;
        font-size: 16px;
      }

      .tools {
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>

<main class="app">

  <header>
    <div class="logo" aria-hidden="true">⌖</div>
    <h1>Dear Friends</h1>
    <p>Add your current location | Add free</p>
  </header>

  <section class="panel" aria-label="Photo options">

    <div class="actions" id="mainActions">

      <button class="action" id="uploadBtn" type="button">
        <span class="symbol">▧</span>
        <span>Upload photo</span>
      </button>

      <button class="action" id="cameraBtn" type="button">
        <span class="symbol">◎</span>
        <span>Open camera</span>
      </button>

    </div>

    <input id="fileInput" type="file" accept="image/*">

    <p class="hint">
      Allow location access when your browser asks.
      Your photo is processed on this device.
    </p>

    <div class="status" id="status" role="status" aria-live="polite"></div>

    <div class="workspace" id="workspace">

      <div class="preview-wrap">

        <video id="video" autoplay playsinline muted></video>

        <canvas id="preview"></canvas>

      </div>

      <!-- Camera buttons: visible only while camera is active -->
      <div class="tools" id="cameraTools" hidden>

        <button class="tool-btn" id="captureBtn" type="button">
          Take photo
        </button>

        <button class="tool-btn secondary" id="closeCameraBtn" type="button">
          Close camera
        </button>

      </div>

      <!-- After stamping, ONLY download button is visible -->
      <div class="tools" id="photoTools" hidden>

        <button class="tool-btn" id="saveBtn" type="button">
          Download photo
        </button>

      </div>

      <p class="small-note">
        The stamp includes the location coordinates, address, and
        the device's local date and time.
      </p>

    </div>

  </section>

  <footer class="watermark">
    Developed by Koushik Ghosh
  </footer>

</main>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);

  const fileInput = $("fileInput");
  const statusBox = $("status");
  const workspace = $("workspace");
  const canvas = $("preview");
  const ctx = canvas.getContext("2d", { alpha: false });
  const video = $("video");

  const cameraTools = $("cameraTools");
  const photoTools = $("photoTools");

  let stream = null;
  let currentPhoto = null;
  let currentStamp = null;

  function showStatus(message, type = "error") {
    statusBox.textContent = message;
    statusBox.className =
      "status show" + (type === "info" ? " info" : "");
  }

  function clearStatus() {
    statusBox.textContent = "";
    statusBox.className = "status";
  }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    video.srcObject = null;
    video.style.display = "none";
  }

  function formatDate(date) {
    return new Intl.DateTimeFormat(undefined, {
      year: "numeric",
      month: "short",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: true
    }).format(date);
  }

  async function getAddress(lat, lon) {
    try {
      const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`, {
        headers: { "Accept-Language": "en" }
      });
      const data = await response.json();
      if (data && data.display_name) {
        // Shorten or clean up display name if needed, or return full display name
        const parts = data.display_name.split(",");
        return parts.slice(0, 3).join(",").trim(); // returns top 3 levels of address (e.g. Road, Neighborhood, City)
      }
    } catch (_) {
      // Fallback if offline or request fails
    }
    return `${lat.toFixed(4)}°, ${lon.toFixed(4)}°`;
  }

  function getLocation() {
    return new Promise((resolve, reject) => {

      if (!("geolocation" in navigator)) {
        reject(new Error("Turn on location service"));
        return;
      }

      navigator.geolocation.getCurrentPosition(

        async position => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          const address = await getAddress(lat, lon);

          resolve({
            latitude: lat,
            longitude: lon,
            accuracy: position.coords.accuracy,
            address: address
          });
        },

        error => {
          if (error.code === 1 || error.code === 2) {
            reject(new Error("Turn on location service"));
          } else if (error.code === 3) {
            reject(new Error("Location request timed out. Please make sure location service is turned on."));
          } else {
            reject(new Error("Turn on location service"));
          }
        },

        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }

      );
    });
  }

  async function getStamp() {
    clearStatus();

    if (navigator.permissions && navigator.permissions.query) {
      try {
        const perm = await navigator.permissions.query({ name: "geolocation" });
        if (perm.state === "denied") {
          showStatus("Turn on location service", "error");
          return null;
        }
      } catch (_) {}
    }

    showStatus("Getting your current location & address...", "info");

    try {

      const location = await getLocation();
      const date = new Date();

      return {
        location,
        date,
        dateText: formatDate(date)
      };

    } catch (error) {

      showStatus(error.message, "error");

      return null;
    }
  }

  function drawStampedImage(image, stamp) {

    const maxDimension = 2400;

    const scale = Math.min(
      1,
      maxDimension / Math.max(image.width, image.height)
    );

    const width = Math.max(1, Math.round(image.width * scale));
    const height = Math.max(1, Math.round(image.height * scale));

    canvas.width = width;
    canvas.height = height;

    ctx.clearRect(0, 0, width, height);
    ctx.drawImage(image, 0, 0, width, height);

    const loc = stamp.location;

    // Location stamp including Address, GPS, and Date/Time
    const lines = [
      `📍 ${loc.address || 'Location'}`,
      `LAT ${loc.latitude.toFixed(6)}° N   |   LON ${loc.longitude.toFixed(6)}° E`,
      stamp.dateText
    ];

    const padding = Math.max(12, Math.round(width * 0.018));
    const fontSize = Math.max(13, Math.round(width * 0.022));
    const lineHeight = fontSize * 1.5;

    ctx.save();

    ctx.font = `600 ${fontSize}px Arial, sans-serif`;

    const boxWidth = Math.min(
      width - padding * 2,
      Math.max(
        ...lines.map(line => ctx.measureText(line).width)
      ) + padding * 2
    );

    const boxHeight =
      lineHeight * lines.length + padding * 1.5;

    const x = padding;
    const y = height - boxHeight - padding;

    ctx.fillStyle = "rgba(0, 0, 0, 0.72)";

    ctx.beginPath();

    const radius = Math.min(12, padding);

    ctx.roundRect(
      x,
      y,
      boxWidth,
      boxHeight,
      radius
    );

    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.textBaseline = "top";
    ctx.textAlign = "left";

    lines.forEach((line, index) => {

      ctx.fillText(
        line,
        x + padding,
        y + padding * 0.65 + index * lineHeight,
        boxWidth - padding * 2
      );

    });

    ctx.restore();

    stopCamera();

    workspace.classList.add("show");
    video.style.display = "none";
    canvas.style.display = "block";

    cameraTools.hidden = true;
    photoTools.hidden = false;

    showStatus(
      "Location name, address and timestamp added. Your photo is ready to download.",
      "info"
    );
  }

  function loadImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const image = new Image();

      image.onload = () => {
        URL.revokeObjectURL(url);
        resolve(image);
      };

      image.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error("Could not open this image. Try another photo."));
      };

      image.src = url;
    });
  }

  async function processFile(file) {
    if (!file || !file.type.startsWith("image/")) {
      showStatus("Please choose a valid image file.", "error");
      return;
    }

    const stamp = await getStamp();
    if (!stamp) return;

    try {
      const image = await loadImage(file);
      currentPhoto = image;
      currentStamp = stamp;
      drawStampedImage(image, stamp);
    } catch (error) {
      showStatus(error.message || "Could not process this photo.", "error");
    }
  }

  $("uploadBtn").addEventListener("click", () => {
    clearStatus();
    fileInput.value = "";
    fileInput.click();
  });

  fileInput.addEventListener("change", event => {
    processFile(event.target.files[0]);
  });

  $("cameraBtn").addEventListener("click", async () => {
    const stamp = await getStamp();
    if (!stamp) return;

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showStatus("Camera access is unavailable. Open this app over HTTPS or use Upload photo.", "error");
      return;
    }

    try {
      stopCamera();

      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: "environment" } }
      });

      currentStamp = stamp;
      video.srcObject = stream;
      video.style.display = "block";
      canvas.style.display = "none";

      workspace.classList.add("show");
      cameraTools.hidden = false;
      photoTools.hidden = true;

      clearStatus();
      await video.play();

    } catch (error) {
      stopCamera();
      showStatus("Could not open the camera. Check camera permission or use Upload photo.", "error");
    }
  });

  $("captureBtn").addEventListener("click", () => {
    if (!stream || !video.videoWidth) {
      showStatus("Camera is not ready yet. Please try again.", "error");
      return;
    }

    const shot = document.createElement("canvas");
    shot.width = video.videoWidth;
    shot.height = video.videoHeight;

    const shotCtx = shot.getContext("2d");
    shotCtx.drawImage(video, 0, 0, shot.width, shot.height);

    const image = new Image();
    image.onload = () => {
      currentPhoto = image;
      drawStampedImage(image, currentStamp);
    };
    image.src = shot.toDataURL("image/jpeg", 0.94);
  });

  $("closeCameraBtn").addEventListener("click", () => {
    stopCamera();
    workspace.classList.remove("show");
    cameraTools.hidden = true;
    photoTools.hidden = true;
    clearStatus();
  });

  $("saveBtn").addEventListener("click", () => {
    if (!canvas.width || !canvas.height) return;

    const saveBtn = $("saveBtn");
    saveBtn.disabled = true;
    saveBtn.textContent = "Preparing download...";

    canvas.toBlob(blob => {
      saveBtn.disabled = false;
      saveBtn.textContent = "Download photo";

      if (!blob) {
        showStatus("Could not save the photo. Please try again.", "error");
        return;
      }

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `geostamp-${new Date().toISOString().replace(/[:.]/g, "-")}.jpg`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }, "image/jpeg", 0.94);
  });

  window.addEventListener("pagehide", stopCamera);

})();
</script>

</body>
</html>
